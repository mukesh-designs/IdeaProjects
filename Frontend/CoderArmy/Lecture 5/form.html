<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in HTML</title>
</head>
<body>
    <form action="">
        <label for="name">Name: </label>
        <input type="text" name="userName" id="name">
        <br><br>

        <label for="age">Age: </label>
        <input type="number" name="userFName" id="age">
        <br><br>

        <label for="email">Email: </label>
        <input type="email" name="useremail" id="email">
        <br><br>

        <label for="pass">Password: </label>
        <input type="password" name="userPassword" id="pass">
        <br><br>

        <label for="">Gender: </label>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="male">
        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="other">Other</label>
        <input type="radio" name="gender" id="other" value="other">
        <br><br>

        <label for="">Subject: </label>
        <label for="c++">C++</label>
        <input type="checkbox" name="subject" id="c++" value="c++">
        <label for="java">Java</label>
        <input type="checkbox" name="subject" id="java" value="java">
        <label for="python">Python</label>
        <input type="checkbox" name="subject" id="python" value="python">
        <label for="javascript">JavaScript</label>
        <input type="checkbox" name="subject" id="javascript" value="javascript">
        <br><br>

        <input type="submit" name="" id="">
        <br><br>
    </form>
</body>
</html>
