<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form</p>
    <hr>

    <form action="">
        <h2>Personal Details: </h2>
        <label for="firstname">First Name: </label>
        <input type="text" name="firstname" id="firstname" placeholder="e.g., Arjun" required>
        <br>

        <br>
        <label for="lastname">Last Name: </label>
        <input type="text" name="lastname" id="lastname" placeholder="e.g., Kumar">
        <br>

        <br>
        <label for="dob">Date Of Birth: </label>
        <input type="date" name="dob" id="dob">
        <br>

        <br>
        <label for="gender">Gender: </label>
        <br>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>
        <br>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>
        <br>
        <input type="radio" name="gender" id="other" value="other">
        <label for="other">Other</label>
        <br>

        <br>
        <label for="uploadphoto">Upload Your Photo: </label>
        <br>
        <input type="file" name="uploadphoto" id="uploadphoto">
        <hr>
        <h2>Contact Information: </h2>
        <br>
        <label for="email">Email Address: </label>
        <input type="email" name="email" id="email" placeholder="you@example.com">
        <br><br>
        <label for="phone">Phone Number: </label>
        <input type="tel" name="phone" id="phone" placeholder="e.g., 987654321">
        <br><br>
        <label for="address">Mailing Address: </label>
        <br>
        <textarea name="address" id="address" cols="30" rows="5" placeholder=""></textarea>
        <hr>
        <h2>Academic Information: </h2>
        <br>
        <label for="course">Select Your Course: </label>
        <select name="course" id="course">
            <option value="CSE">CSE</option>
            <option value="ME">ME</option>
            <option value="CE">CE</option>
        </select>
        <br><br>
        <label for="interest">Extracurricular Interests: </label>
        <br>
        <input type="checkbox" name="interest" id="sports" value="sports">
        <label for="sports">Sports</label>
        <br>
        <input type="checkbox" name="interest" id="mna" value="mna">
        <label for="mna">Music & Arts</label>
        <br>
        <input type="checkbox" name="interest" id="tc" value="tc">
        <label for="tc">Technology Clubs</label>
        <br>
        <input type="checkbox" name="interest" id="v" value="v">
        <label for="v">Volunteering</label>
        <hr>
        <h2>Create Your Account: </h2>
        <br>
        <label for="password">Create a Password: </label>
        <input type="password" name="password" id="password">
        <br><br>
        <label for="securityquestion">Security Question: </label>
        <select name="securityquestion" id="securityquestion">
            <option value="petsname">What was your first pet's name?</option>
            <option value="book">What is your favourate book name</option>
        </select>
        <br><br>
        <label for="securityanswer">Security Answer: </label>
        <input type="text" name="securityanswer" id="securityanswer">
        <br><br>
        <input type="checkbox" name="tnc" id="tnc">
        <label for="tnc">I agree to the Terms and Conditions.</label>
        <br>
        <hr>
        <button type="submit">Register</button>
        <button type="reset">Clear Form</button>

    </form>
</body>
</html>
