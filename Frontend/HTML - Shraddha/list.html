<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <!-- Unordered List  -->
    <ul>
        <li>Apple
            <ul>
                <li>Color: Red</li>
                <li>Season: Winter</li>
            </ul>
        </li>
        <li>Mango
            <ul>
                <li>Color: Yellow</li>
                <li>Season: Summer</li>
            </ul>
        </li>
        <li>Litchi</li>
    </ul>

    <!-- Ordered List  -->
     <ol>
        <li>Apple
            <ol>
                <li>Color: Red</li>
                <li>Season: Winter</li>
            </ol>
        </li>
        <li>Mango
            <ol>
                <li>Color: Yellow</li>
                <li>Season: Summer</li>
            </ol>
        </li>
        <li>Litchi</li>
     </ol>
</body>
</html>
