<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <!-- Forms in HTML  -->
     <h4>Registration Form: </h4>
    <form action="/action.php">
        <input type="text" placeholder="Enter Username">
        <br><br>
        <input type="password" placeholder="Enter Password">

        <hr />
        <h5>Select Your Class: </h5>
        <label for="101">
            <input type="radio" value="class XI" name="class" id="101"> class XI
        </label>
        <br>
        <label for="102">
            <input type="radio" value="class XII" name="class" id="102"> class XII
        </label>

        <hr/>
        <h5>Select Fav Subjects: </h5>
        <label for="math">
            <input type="checkbox" name="subject" id="101" value="math"> Math
        </label>
        <br>
        <label for="phy">
            <input type="checkbox" name="subject" id="102" value="phy"> Physics
        </label>
        <br>
        <label for="chem">
            <input type="checkbox" name="subject" id="103" value="chem"> Chemistry
        </label>
        <br>
        <label for="CS">
            <input type="checkbox" name="subject" id="104" value="CS"> Computer Science
        </label>
        <br>
        <br>
        <textarea name="feedback" id="101" placeholder="Please Give your valuable feedback here" rows="5" cols="50" ></textarea>
        <br>
        <br>
        <h5>Select Your City:</h5>
        <select name="city">
            <option value="Delhi">Delhi</option>
            <option value="Banglore">Banglore</option>
            <option value="Pune">Pune</option>
            <option value="Mumbai">Mumbai</option>
        </select>
        <br><br>
        <input type="submit" value="submit">

    </form>
</body>

</html>
