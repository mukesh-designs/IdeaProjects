<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>

<body>
    <!-- HTML Tables  -->
    <!-- caption in Tables  -->
    <table border="1">
        <thead>
            <caption>Student Data</caption>
            <tr>
                <th>Name</th>
                <th>Roll No</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mukesh</td>
                <td>87</td>
            </tr>
            <tr>
                <td>Ritesh</td>
                <td>77</td>
            </tr>
            <tr>
                <td>Aakash</td>
                <td>67</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
